services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      APP_ADDR: ":8080"
      APP_ORIGIN: "${DEPLOY_ORIGIN:-http://localhost:8080}"
      DATA_DIR: /data
      WEB_DIR: /app/web
      DEMO_MODE: "false"
      MEDIA_PROXY_URL: "${DOCKER_MEDIA_PROXY_URL:-}"
    volumes:
      - wallplanet-media:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  demo:
    profiles: [demo]
    build: .
    restart: unless-stopped
    ports:
      - "8081:8080"
    env_file: .env
    environment:
      APP_ADDR: ":8080"
      APP_ORIGIN: "http://localhost:8081"
      DATA_DIR: /data
      WEB_DIR: /app/web
      DEMO_MODE: "true"
    volumes:
      - wallplanet-demo-media:/data
volumes:
  wallplanet-media:
  wallplanet-demo-media:
